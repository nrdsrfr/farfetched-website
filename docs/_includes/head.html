<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="48x48">
  <link rel="icon" type="image/png" href="{{ "/assets/icon-192.png" | relative_url }}" sizes="192x192">
  <link rel="apple-touch-icon" href="{{ "/assets/apple-touch-icon.png" | relative_url }}">
  <!-- Far Fetched design tokens -->
  {%- assign ds_dir = "/assets/ds/far-fetched-design-system-8aeaa1ad-9b12-4655-ade3-00f3e2d42a1e" -%}
  <link rel="stylesheet" href="{{ ds_dir | append: '/tokens/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ ds_dir | append: '/tokens/colors.css' | relative_url }}">
  <link rel="stylesheet" href="{{ ds_dir | append: '/tokens/typography.css' | relative_url }}">
  <link rel="stylesheet" href="{{ ds_dir | append: '/tokens/spacing.css' | relative_url }}">
  <link rel="stylesheet" href="{{ ds_dir | append: '/tokens/effects.css' | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  <!-- Calendly badge widget begin -->
  <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
  <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
  <script type="text/javascript">window.onload = function() { Calendly.initBadgeWidget({ url: 'https://calendly.com/jessecary/30min', text: 'Schedule a Consultation', color: '#2563eb', textColor: '#ffffff', branding: true }); }</script>
  <!-- Calendly badge widget end -->
</head>
