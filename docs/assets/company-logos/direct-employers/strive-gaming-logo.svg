<svg width="120" height="60" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="striveBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D47A1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="60" fill="#FFFFFF" rx="6"/>
  
  <!-- Gaming Symbol -->
  <rect x="12" y="20" width="16" height="20" fill="url(#striveBrand)" rx="2"/>
  <rect x="16" y="24" width="8" height="12" fill="#FFFFFF" rx="1"/>
  
  <!-- Brand Text -->
  <text x="35" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0D47A1">STRIVE</text>
  <text x="35" y="39" font-family="Arial, sans-serif" font-size="8" fill="#666666">GAMING PLATFORM</text>
  
  <!-- North America Focus Indicator -->
  <circle cx="105" cy="15" r="3" fill="#FF5722" opacity="0.7"/>
  <text x="90" y="50" font-family="Arial, sans-serif" font-size="6" fill="#999999">NORTH AMERICA</text>
</svg>
