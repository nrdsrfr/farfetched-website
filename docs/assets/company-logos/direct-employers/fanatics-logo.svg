<svg width="120" height="60" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fanaticsBrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="60" fill="#FFFFFF" rx="6"/>
  
  <!-- Sports Icon -->
  <circle cx="20" cy="30" r="8" fill="url(#fanaticsBrand)" opacity="0.8"/>
  <circle cx="20" cy="30" r="4" fill="#FFFFFF"/>
  
  <!-- Brand Text -->
  <text x="35" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A">FANATICS</text>
  <text x="35" y="40" font-family="Arial, sans-serif" font-size="8" fill="#666666">SPORTS COMMERCE</text>
  
  <!-- Accent Lines -->
  <rect x="35" y="28" width="60" height="1" fill="url(#fanaticsBrand)" opacity="0.3"/>
</svg>
