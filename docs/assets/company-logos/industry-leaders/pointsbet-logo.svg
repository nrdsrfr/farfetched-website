<svg width="120" height="60" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pointsbetBrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9900;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="60" fill="#FFFFFF" rx="6"/>
  
  <!-- Sports Betting Symbol -->
  <rect x="12" y="20" width="20" height="20" fill="url(#pointsbetBrand)" rx="10"/>
  <text x="22" y="34" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P</text>
  
  <!-- Brand Text -->
  <text x="38" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FF6600">POINTSBET</text>
  <text x="38" y="35" font-family="Arial, sans-serif" font-size="8" fill="#666666">SPORTSBOOK</text>
  <text x="38" y="46" font-family="Arial, sans-serif" font-size="6" fill="#999999">ACQUIRED BY FANATICS</text>
  
  <!-- Accent -->
  <circle cx="105" cy="20" r="2" fill="url(#pointsbetBrand)"/>
</svg>
